name: 📱 Android APK Bulut Derleyici (Makro Takip)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Native Android APK Derle
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Proje kodunu çek
        uses: actions/checkout@v4

      - name: 🟢 Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Java JDK 21 kur (Capacitor Android için)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Android SDK kur
        uses: android-actions/setup-android@v3

      - name: 📦 Bağımlılıkları yükle ve Web paketini derle
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: 🔨 Gradle ile kurulumluk APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 İndirilebilir APK Dosyasını Hazırla (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MakroTakip-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
